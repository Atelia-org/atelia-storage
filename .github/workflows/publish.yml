name: Publish storage packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable package version, for example 0.1.1-preview.1
        required: true
        type: string
      project:
        description: Publish all five packages or one selected project
        required: true
        type: choice
        default: EventJournal
        options:
          - EventJournal
          - RbfSegmentStore
          - All
      dependency_versions:
        description: JSON of selected project's published dependency versions; only for single-package mode
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require selected package tag
        if: inputs.project != 'All'
        shell: pwsh
        env:
          STORAGE_VERSION: ${{ inputs.version }}
          STORAGE_PROJECT: ${{ inputs.project }}
        run: |
          $expected = "refs/tags/Atelia.${env:STORAGE_PROJECT}-v${env:STORAGE_VERSION}"
          if ($env:GITHUB_REF -cne $expected) { throw "Dispatch selective publication from $expected." }
          $tagCommit = (& git rev-parse --verify "$expected^{commit}" | Out-String).Trim()
          $headCommit = (& git rev-parse --verify HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $headCommit) { throw 'Selected tag does not point at checked-out HEAD.' }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate release artifacts
        shell: pwsh
        env:
          STORAGE_VERSION: ${{ inputs.version }}
          STORAGE_PROJECT: ${{ inputs.project }}
          STORAGE_DEPENDENCY_VERSIONS: ${{ inputs.dependency_versions }}
        run: |
          dotnet build Atelia.Storage.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Atelia.Storage.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:STORAGE_PROJECT -ne 'All') {
            $dependencies = $env:STORAGE_DEPENDENCY_VERSIONS | ConvertFrom-Json -AsHashtable
            ./eng/Pack.ps1 -Project $env:STORAGE_PROJECT -Version $env:STORAGE_VERSION -DependencyVersions $dependencies -OutputDirectory ./artifacts/feed
            ./eng/Test-Package.ps1 -Project $env:STORAGE_PROJECT -Version $env:STORAGE_VERSION -FeedDirectory ./artifacts/feed -WorkDirectory (Join-Path '${{ runner.temp }}' 'storage-package-smoke')
          } else {
            ./eng/Pack.ps1 -Version $env:STORAGE_VERSION -OutputDirectory ./artifacts/feed
            ./eng/Test-Package.ps1 -Version $env:STORAGE_VERSION -FeedDirectory ./artifacts/feed -WorkDirectory (Join-Path '${{ runner.temp }}' 'storage-package-smoke')
          }
      # Configure this repository/workflow/environment as a nuget.org trusted publisher first.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish dependency order from verified manifest
        shell: pwsh
        env:
          STORAGE_VERSION: ${{ inputs.version }}
          STORAGE_PROJECT: ${{ inputs.project }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $manifestName = if ($env:STORAGE_PROJECT -ne 'All') { "manifest.Atelia.${env:STORAGE_PROJECT}.${env:STORAGE_VERSION}.json" } else { "manifest.$env:STORAGE_VERSION.json" }
          $manifest = Get-Content (Join-Path './artifacts/feed' $manifestName) -Raw | ConvertFrom-Json
          $revision = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $manifest.sourceRevision -cne $revision -or $manifest.version -cne $env:STORAGE_VERSION) { throw 'Manifest does not match the selected release.' }
          $expectedIds = @(if ($env:STORAGE_PROJECT -eq 'All') { 'Atelia.Primitives'; 'Atelia.Data'; 'Atelia.Rbf'; 'Atelia.RbfSegmentStore'; 'Atelia.EventJournal' } else { "Atelia.$env:STORAGE_PROJECT" })
          if (@($manifest.packages).Count -ne $expectedIds.Count) { throw 'Unexpected release package count.' }
          for ($index = 0; $index -lt $expectedIds.Count; $index++) {
            $package = $manifest.packages[$index]
            if ($package.id -cne $expectedIds[$index]) { throw "Unexpected release package: $($package.id)" }
            $path = Join-Path './artifacts/feed' $package.file
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $package.sha256) { throw "Candidate package changed: $($package.id)" }
            $symbols = Join-Path './artifacts/feed' $package.symbolsFile
            if ((Get-FileHash -LiteralPath $symbols -Algorithm SHA256).Hash -ine $package.symbolsSha256) { throw "Candidate symbols changed: $($package.id)" }
            dotnet nuget push $path --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify selected public package and consumer
        if: inputs.project != 'All'
        shell: pwsh
        env:
          STORAGE_VERSION: ${{ inputs.version }}
          STORAGE_PROJECT: ${{ inputs.project }}
        run: |
          ./eng/Verify-Published.ps1 -Project $env:STORAGE_PROJECT -Version $env:STORAGE_VERSION -FeedDirectory ./artifacts/feed -WorkDirectory (Join-Path '${{ runner.temp }}' 'storage-public-smoke')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/feed
            ${{ runner.temp }}/storage-package-smoke/verified-packages.json
            ${{ runner.temp }}/storage-public-smoke/published-check.json
          if-no-files-found: ignore
